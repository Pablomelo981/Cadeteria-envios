<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#067647">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Cadetería - Pedidos</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#f2f4f7;--card:#fff;--text:#101828;--muted:#667085;--green:#067647;--blue:#175cd3;--red:#b42318;--orange:#c4320a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{background:var(--green);color:white;padding:18px 16px;position:sticky;top:0;z-index:1000}
.header-row{max-width:900px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
header h1{margin:0;font-size:23px}
header small{opacity:.9}
.wrap{max-width:900px;margin:auto;padding:14px}
.card{background:#fff;border-radius:18px;padding:17px;margin:12px 0;box-shadow:0 4px 18px #0000000d}
button,input{font:inherit}
button{border:0;border-radius:12px;padding:12px 14px;font-weight:750;cursor:pointer}
button:disabled{opacity:.55}
.login button,.refresh{width:100%;background:var(--green);color:white}
.logout{background:#475467;color:white}
.blue{background:var(--blue);color:white;width:100%;margin-top:10px}
.error{background:#fff1f0;border:1px solid #f4b4af;color:var(--red);padding:12px;border-radius:12px;margin-top:10px;word-break:break-word}
.ok{background:#ecfdf3;border:1px solid #abefc6;color:var(--green);padding:12px;border-radius:12px;margin-top:10px}
.hidden{display:none!important}
label{display:block;font-weight:700;margin:10px 0 6px}
input{width:100%;padding:13px;border:1px solid #d0d5dd;border-radius:12px}
.order{border:2px solid #eaecf0}
.order.urgent{border-color:#f79009}
.top{display:flex;justify-content:space-between;gap:10px;align-items:center}
.top h2{margin:0}
.meta{font-size:13px;color:var(--muted);margin-top:4px}
.info{margin:8px 0}
.badge{display:inline-block;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:800;background:#eef4ff;color:#175cd3}
.badge.urgent{background:#fff0e6;color:var(--orange)}
.money{font-size:29px;font-weight:850}
.map{height:240px;border-radius:13px;margin-top:12px}
.route-summary{margin-top:12px}
.route-stop{padding:10px 0;border-bottom:1px solid #eaecf0}
.route-map{height:340px;border-radius:14px;margin-top:12px;overflow:hidden}
.green{background:var(--green);color:#fff;width:100%;margin-top:10px}
.empty{text-align:center;color:var(--muted);padding:28px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.actions button{width:100%}
.status-select{width:100%;padding:12px;border:1px solid #d0d5dd;border-radius:12px;margin-top:10px;background:white;font:inherit}
@media(max-width:520px){.actions{grid-template-columns:1fr}}
.danger{background:#dc2626;color:#fff;border:0;padding:10px 14px;border-radius:10px;font-weight:700;cursor:pointer}.danger:active{transform:scale(.98)}
</style>
</head>
<body>

<header>
  <div class="header-row">
    <div>
      <h1>🚚 Cadetería</h1>
      <small>Panel de pedidos</small>
    </div>
    <button id="logout" class="logout">Salir</button>
  </div>
</header>

<div class="wrap">

<section id="loginCard" class="card login">
  <h2>🔐 Ingresar</h2>
  <p style="color:var(--muted)">Esta aplicación es solamente para la cadetería.</p>
  <label>Correo</label>
  <input id="email" type="email" autocomplete="username" placeholder="Correo del administrador">
  <label>Contraseña</label>
  <input id="password" type="password" autocomplete="current-password" placeholder="Contraseña">
  <button id="login">Ingresar</button>
  <div id="loginError" class="error hidden"></div>
</section>

<section id="app" class="hidden">
  <div class="card">
    <div class="top">
      <div>
        <h2>📦 Pedidos</h2>
        <div id="count" class="meta">Cargando…</div>
      </div>
      <button id="refresh" class="refresh">🔄</button>
    </div>
    <div id="message"></div>
  </div>

  <div class="card route-card">
    <h2 style="margin-top:0">🚚 Recorrido</h2>
    <div class="meta">Ordena los pedidos pendientes desde tu punto de partida, del más cercano al siguiente.</div>
    <button id="buildRoute" class="green" type="button">🚚 Armar recorrido</button>
    <div id="routeSummary" class="route-summary"></div>
    <div id="routeMap" class="route-map"></div>
  </div>

  <div id="orders"></div>
</section>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const SUPABASE_URL="https://umqbrzgbsfzeggnyhfcu.supabase.co";
const SUPABASE_KEY="sb_publishable_WIcZQ2owPoPYs5edb51j-g_mLvI0VTX";
const ADMIN_UUID="1542195c-af82-42e6-b011-bb7a9923a88f";

const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);

function esc(v){
 return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}
function money(v){return "$"+Number(v||0).toFixed(0);}
function date(v){return v?new Date(v).toLocaleString("es-UY",{dateStyle:"short",timeStyle:"short"}):"";}
function paymentLabel(o){
 const f=String(o.forma_pago||"").toLowerCase();
 if(f==="mercado_pago") return "💳 Mercado Pago";
 if(f==="transferencia") return "🏦 Transferencia bancaria";
 if(f==="efectivo") return "💵 Efectivo al recibir";
 return "—";
}
function paymentStatusLabel(o){
 const f=String(o.forma_pago||"").toLowerCase();
 const e=String(o.estado_pago||"").toLowerCase();
 if(e==="pagado" && f==="mercado_pago") return "<span class=\"badge\">PAGADO POR MERCADO PAGO</span>";
 if(e==="pagado" && f==="transferencia") return "<span class=\"badge\">PAGADO POR TRANSFERENCIA</span>";
 if(f==="efectivo") return "<span class=\"badge\">COBRAR EN EL MOMENTO</span>";
 if(e) return esc(e.replaceAll("_"," "));
 return "PENDIENTE";
}

function distanceKm(a,b){
 const R=6371,p=Math.PI/180,dLat=(b.lat-a.lat)*p,dLon=(b.lon-a.lon)*p;
 const x=Math.sin(dLat/2)**2+Math.cos(a.lat*p)*Math.cos(b.lat*p)*Math.sin(dLon/2)**2;
 return 2*R*Math.asin(Math.sqrt(x));
}
let routeMap=null;
let loadVersion=0;
let startPromise=null;
async function buildRoute(){
 const btn=$("buildRoute"); btn.disabled=true; btn.textContent="🚚 Calculando…";
 try{
  const {data,error}=await sb.from("pedidos").select("id,cliente,direccion,latitud,longitud,estado,created_at").in("estado",["pendiente","aceptado","en camino"]).order("created_at",{ascending:true});
  if(error) throw error;
  const stops=(data||[]).map(o=>({...o,lat:Number(o.latitud),lon:Number(o.longitud)})).filter(o=>Number.isFinite(o.lat)&&Number.isFinite(o.lon));
  if(!stops.length){$("routeSummary").innerHTML="📭 No hay pedidos pendientes con ubicación."; $("routeMap").style.display="none"; return;}
  let current={lat:-34.8245,lon:-56.1650}, remaining=[...stops], ordered=[];
  while(remaining.length){
   let bi=0,bd=Infinity;
   for(let i=0;i<remaining.length;i++){const d=distanceKm(current,remaining[i]);if(d<bd){bd=d;bi=i;}}
   const n=remaining.splice(bi,1)[0]; n.tramoKm=bd; ordered.push(n); current=n;
  }
  $("routeSummary").innerHTML="<b>🏁 Salida:</b> Camino Teniente Rinaldi / Av. San Martín"+ordered.map((o,i)=>`<div class="route-stop"><b>${i+1}. 📦 Pedido #${esc(o.id)}</b> — ${esc(o.cliente)}<br><span class="meta">↳ ${esc(o.direccion)} · ${o.tramoKm.toFixed(2)} km desde el punto anterior</span></div>`).join("");
  const points=[[-34.8245,-56.1650],...ordered.map(o=>[o.lat,o.lon])];
  if(routeMap) routeMap.remove();
  routeMap=L.map("routeMap").setView(points[0],13);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap contributors"}).addTo(routeMap);
  points.forEach((p,i)=>L.marker(p).addTo(routeMap).bindPopup(i===0?"🏁 Salida":`${i}. 📦 Pedido #${ordered[i-1].id}`));
  const line=L.polyline(points).addTo(routeMap); routeMap.fitBounds(line.getBounds(),{padding:[20,20]}); $("routeMap").style.display="block";
  const dest=ordered[ordered.length-1],waypoints=ordered.slice(0,-1).map(o=>`${o.lat},${o.lon}`).join("|");
  const url="https://www.google.com/maps/dir/?api=1&origin="+encodeURIComponent("-34.8245,-56.1650")+"&destination="+encodeURIComponent(`${dest.lat},${dest.lon}`)+(waypoints?"&waypoints="+encodeURIComponent(waypoints):"");
  $("routeSummary").insertAdjacentHTML("afterbegin",`<div style="margin-bottom:10px"><button class="blue" type="button" onclick="window.open('${url}','_blank')">🗺️ Abrir recorrido en Google Maps</button></div>`);
 }catch(e){$("routeSummary").innerHTML="<div class='error'>No se pudo armar el recorrido: "+esc(e.message)+"</div>";}
 finally{btn.disabled=false;btn.textContent="🚚 Armar recorrido";}
}
async function currentUser(){
 const {data:{user}}=await sb.auth.getUser();
 return user;
}

async function login(){
 $("loginError").classList.add("hidden");
 const email=$("email").value.trim(),password=$("password").value;
 if(!email||!password){$("loginError").textContent="Completá correo y contraseña."; $("loginError").classList.remove("hidden"); return;}
 $("login").disabled=true;
 const {error}=await sb.auth.signInWithPassword({email,password});
 $("login").disabled=false;
 if(error){$("loginError").textContent=error.message;$("loginError").classList.remove("hidden");return;}
}

async function start(){
 if(startPromise) return startPromise;
 startPromise=(async()=>{
 const user=await currentUser();
 if(!user){
   $("loginCard").classList.remove("hidden");
   $("app").classList.add("hidden");
   $("logout").classList.add("hidden");
   return;
 }
 if(user.id!==ADMIN_UUID){
   await sb.auth.signOut();
   $("loginError").textContent="Este usuario no tiene acceso al panel de la cadetería.";
   $("loginError").classList.remove("hidden");
   return;
 }
 $("loginCard").classList.add("hidden");
 $("app").classList.remove("hidden");
 $("logout").classList.remove("hidden");
 await loadOrders();
 })();
 try{ await startPromise; } finally { startPromise=null; }
}

async function loadOrders(){
 const requestVersion=++loadVersion;
 $("count").textContent="Actualizando…";
 $("orders").innerHTML="";
 let {data,error}=await sb.from("pedidos").select("*").order("created_at",{ascending:false});
 if(requestVersion!==loadVersion) return;
 if(error){
   $("count").textContent="";
   $("message").innerHTML='<div class="error"><b>No se pudieron cargar los pedidos.</b><br>'+esc(error.message)+'</div>';
   return;
 }
 $("message").innerHTML="";
 const unique=[]; const seen=new Set();
 for(const o of (data||[])){ const k=String(o.id); if(!seen.has(k)){seen.add(k); unique.push(o);} }
 data=unique;
 $("count").textContent=data.length+" pedido(s)";
 if(!data.length){
   $("orders").innerHTML='<div class="card empty">📭 Todavía no hay pedidos.</div>';
   return;
 }
 data.forEach(renderOrder);
}

function renderOrder(o){
 const div=document.createElement("div");
 div.className="card order"+(o.urgente?" urgent":"");
 const lat=Number(o.latitud),lon=Number(o.longitud);
 div.innerHTML=`
  <div class="top">
   <div><h2>📦 Pedido #${esc(o.id)}</h2><div class="meta">${esc(date(o.created_at))}</div></div>
   ${o.urgente?'<span class="badge urgent">🚨 URGENTE</span>':'<span class="badge">NORMAL</span>'}
  </div>
  <div class="info"><b>👤 Cliente:</b> ${esc(o.cliente)}</div>
  <div class="info"><b>📞 Teléfono:</b> ${esc(o.telefono)}</div>
  <div class="info"><b>📍 Entrega:</b><br>${esc(o.direccion)}</div>
  <div class="info"><b>📏 Distancia:</b> ${esc(o.distancia_km)} km</div>
  <div class="money">${money(o.precio_total)}</div>
  <div class="info"><b>💳 Pago:</b> ${paymentLabel(o)}</div>
  <div class="info"><b>Estado del pago:</b> ${paymentStatusLabel(o)}</div>
  ${String(o.forma_pago||"").toLowerCase()==="transferencia" && String(o.estado_pago||"").toLowerCase()!=="pagado" ? '<button class="blue" onclick="markTransferPaid(\''+esc(o.id)+'\')">🏦 Marcar transferencia recibida</button>' : ""}
  <div class="info"><b>Estado del pedido:</b>
   <select class="status-select" data-id="${esc(o.id)}">
    ${["pendiente","aceptado","en camino","entregado","cancelado"].map(s=>`<option value="${esc(s)}" ${String(o.estado||"pendiente")===s?"selected":""}>${s}</option>`).join("")}
   </select>
  </div>
  ${o.observaciones?'<div class="info"><b>📝 Observaciones:</b><br>'+esc(o.observaciones)+'</div>':""}
  <div id="map-${esc(o.id)}" class="map"></div>
  <div class="actions">
   <button class="blue" onclick="openMaps(${lat},${lon})">🗺️ Google Maps</button>
   <button class="blue" onclick="callPhone('${encodeURIComponent(o.telefono||"")}')">📞 Llamar</button>
   <button class="danger" onclick="deleteOrder('${esc(o.id)}')">🗑️ Eliminar pedido</button>
  </div>
 `;
 $("orders").appendChild(div);

 const select=div.querySelector(".status-select");
 select.addEventListener("change",()=>updateStatus(o.id,select.value));

 if(Number.isFinite(lat)&&Number.isFinite(lon)){
  const map=L.map("map-"+o.id,{zoomControl:true}).setView([lat,lon],16);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap contributors"}).addTo(map);
  L.marker([lat,lon]).addTo(map).bindPopup("📍 Entrega").openPopup();
 }
}

async function markTransferPaid(id){
 const ok=confirm("¿Confirmás que recibiste la transferencia de este pedido?");
 if(!ok) return;
 const {error}=await sb.from("pedidos").update({estado_pago:"pagado"}).eq("id",id);
 if(error){
   alert("No se pudo marcar el pago: "+error.message);
   return;
 }
 await loadOrders();
}

async function deleteOrder(id){
 const ok=confirm("¿Seguro que querés eliminar este pedido? Esta acción no se puede deshacer.");
 if(!ok) return;
 const {error}=await sb.from("pedidos").delete().eq("id",id);
 if(error){
   alert("No se pudo eliminar el pedido: "+error.message);
   return;
 }
 await loadOrders();
}

async function updateStatus(id,status){
 const {error}=await sb.from("pedidos").update({estado:status}).eq("id",id);
 if(error){
   alert("No se pudo actualizar el estado: "+error.message);
   await loadOrders();
   return;
 }
 await loadOrders();
}

function openMaps(lat,lon){
 window.open("https://www.google.com/maps/dir/?api=1&destination="+encodeURIComponent(lat+","+lon),"_blank");
}
function callPhone(phone){
 if(phone) location.href="tel:"+decodeURIComponent(phone);
}

$("login").onclick=login;
$("refresh").onclick=loadOrders;
$("buildRoute").onclick=buildRoute;
$("logout").onclick=async()=>{await sb.auth.signOut();location.reload();};

sb.auth.onAuthStateChange((event,session)=>{
 if(session && (event==="INITIAL_SESSION" || event==="SIGNED_IN")) setTimeout(()=>start(),0);
});

start();

// Mientras la app está abierta, revisa pedidos nuevos cada 15 segundos.

if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));}
</script>
</body>
</html>
