<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Calculador de envíos</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

:root{
  --bg:#f4f6f8;
  --card:#fff;
  --text:#17202a;
  --muted:#667085;
  --accent:#111827;
  --blue:#4285f4;
  --green:#067647;
  --red:#b42318;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  background:var(--bg);
  color:var(--text);
}

.wrap{
  max-width:720px;
  margin:auto;
  padding:18px;
}

.brand{
  text-align:center;
  padding:12px 0 8px;
}

.brand h1{
  margin:0;
  font-size:28px;
}

.brand p{
  margin:6px 0;
  color:var(--muted);
}

.card{
  background:var(--card);
  border-radius:18px;
  padding:18px;
  margin:14px 0;
  box-shadow:0 4px 18px #00000010;
}

label{
  display:block;
  font-weight:700;
  margin:10px 0 6px;
}

input,
button,
textarea{
  width:100%;
  padding:13px;
  border:1px solid #d0d5dd;
  border-radius:12px;
  font-size:16px;
}

button{
  background:var(--accent);
  color:white;
  border:0;
  font-weight:700;
  cursor:pointer;
  margin-top:12px;
}

button:disabled{
  opacity:.55;
}

.secondary{
  background:var(--blue);
}

.success{
  background:var(--green);
}

.danger{
  background:var(--red);
}

.light-button{
  background:#eef2f6;
  color:#17202a;
  border:1px solid #d0d5dd;
}

.result{
  display:none;
  text-align:center;
}

.price{
  font-size:42px;
  font-weight:800;
  margin:6px;
}

.zone{
  font-size:20px;
  font-weight:750;
}

.small{
  color:var(--muted);
  font-size:13px;
}

#map{
  height:420px;
  width:100%;
  border-radius:14px;
  margin-top:12px;
  overflow:hidden;
}

.legend div{
  display:flex;
  justify-content:space-between;
  padding:7px 0;
  border-bottom:1px solid #eee;
}

.point-help{
  background:#eef4ff;
  border-radius:12px;
  padding:12px;
  margin-top:10px;
  font-size:14px;
}

.search-results{
  margin-top:8px;
}

.search-option{
  background:#f8fafc;
  color:#17202a;
  border:1px solid #d0d5dd;
  text-align:left;
  margin-top:7px;
  font-weight:500;
}

.location-box{
  background:#f6fef9;
  border:1px solid #b7ebcd;
  border-radius:12px;
  padding:12px;
  margin-top:10px;
}

.marker-help{
  background:#fff8e7;
  border:1px solid #f2d38a;
  border-radius:12px;
  padding:12px;
  margin-top:10px;
  font-size:14px;
}

hr{
  border:0;
  border-top:1px solid #eee;
  margin:18px 0;
}

</style>
</head>

<body>

<div class="wrap">

  <div class="brand">
    <h1>🚚 Calculá tu envío</h1>
    <p>Indicá dónde estás y dónde querés recibir el envío.</p>
  </div>


  <!-- =========================
       ORIGEN / CLIENTE
  ========================== -->

  <div class="card">

    <h3 style="margin-top:0">
      📍 ¿Dónde estás?
    </h3>

    <button
      id="useLocation"
      type="button"
      class="success"
    >
      📍 Usar mi ubicación actual
    </button>

    <label for="originSearch">
      Buscar mi ubicación
    </label>

    <input
      id="originSearch"
      placeholder="Ej.: Av. Italia y Comercio"
      autocomplete="street-address"
    >

    <button
      id="searchOrigin"
      type="button"
      class="light-button"
    >
      🔎 Buscar ubicación
    </button>

    <div
      id="originResults"
      class="search-results"
    ></div>

    <div
      id="originStatus"
      class="small"
      style="margin-top:10px"
    ></div>

    <div class="location-box">
      <b>💡 Podés mover el marcador</b><br>
      Después de encontrar tu ubicación, arrastrá el marcador
      hasta la esquina o puerta exacta.
    </div>

  </div>


  <!-- =========================
       DESTINO
  ========================== -->

  <div class="card">

    <h3 style="margin-top:0">
      📦 Dirección de entrega
    </h3>

    <label for="calle">
      Primera calle
    </label>

    <input
      id="calle"
      placeholder="Ej.: Av. Italia"
      autocomplete="street-address"
    >

    <label for="esquina">
      Esquina / segunda calle
    </label>

    <input
      id="esquina"
      placeholder="
