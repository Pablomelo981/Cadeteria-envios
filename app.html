<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#067647">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Cadetería - Pedidos</title>

<link rel="manifest" href="manifest.json">
<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#f2f4f7;color:#101828;
 font-family:Arial,sans-serif
}
header{
 background:#067647;color:white;padding:18px;
 text-align:center;font-size:21px;font-weight:bold
}
main{max-width:700px;margin:auto;padding:14px}
.card{
 background:white;border-radius:16px;padding:16px;margin:12px 0;
 box-shadow:0 3px 12px #0002
}
input,select,button{
 width:100%;padding:13px;margin:6px 0;border-radius:10px;
 border:1px solid #ccc;font-size:16px
}
button{background:#067647;color:white;border:0;font-weight:bold}
.red{background:#b42318}
.blue{background:#175cd3}
.gray{background:#475467}
.notify{background:#175cd3}
.new{border:3px solid #12b76a}
.urgent{color:#b42318;font-weight:bold}
.hidden{display:none}
#error{color:#b42318;font-weight:bold}
.small{color:#667085;font-size:14px}
.success{color:#067647;font-weight:bold}
.warning{color:#b54708;font-weight:bold}
</style>
</head>

<body>

<header>🚴 CADETERÍA - PEDIDOS</header>

<main>

<div id="loginBox" class="card">

<h2>Iniciar sesión</h2>

<input id="email"
 type="email"
 placeholder="Correo electrónico"
 autocomplete="email">

<input id="password"
 type="password"
 placeholder="Contraseña"
 autocomplete="current-password">

<button id="loginBtn">
Ingresar
</button>

<p id="error"></p>

</div>

<div id="app" class="hidden">

<div class="card">

<button class="gray" id="logoutBtn">
Cerrar sesión
</button>

<button id="notificationBtn" class="notify">
🔔 Activar notificaciones
</button>

<p id="notificationStatus" class="small">
Las notificaciones todavía no están activadas.
</p>

<p class="small">
Los pedidos se actualizan automáticamente.
</p>

</div>

<div id="orders"></div>

</div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const SUPABASE_URL =
"https://umqbrzgbsfzeggnyhfcu.supabase.co";

const SUPABASE_KEY =
"sb_publishable_WIcZQ2owPoPYs5edb51j-g_mLvI0VTX";

const ADMIN_ID =
"1542195c-af82-42e6-b011-bb7a9923a88f";

const FUNCTION_URL =
SUPABASE_URL+"/functions/v1/smooth-worker";

const sb =
window.supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);

let refreshTimer=null;


/* =========================
   LOGIN
========================= */

async function login(){

 const email=
  document.getElementById("email").value.trim();

 const password=
  document.getElementById("password").value;

 const error=
  document.getElementById("error");

 const btn=
  document.getElementById("loginBtn");

 if(!email || !password){

  error.textContent=
   "Ingresá el correo y la contraseña.";

  return;
 }

 btn.disabled=true;
 btn.textContent="Ingresando...";
 error.textContent="";

 try{

  const {data,error:loginError}=
   await sb.auth.signInWithPassword({
    email,
    password
   });

  if(loginError){

   error.textContent=
    loginError.message ||
    "Correo o contraseña incorrectos.";

   btn.disabled=false;
   btn.textContent="Ingresar";

   return;
  }

  if(!data.user ||
     data.user.id!==ADMIN_ID){

   await sb.auth.signOut();

   error.textContent=
    "Este usuario no tiene permiso de administrador.";

   btn.disabled=false;
   btn.textContent="Ingresar";

   return;
  }

  await mostrarAplicacion();

  btn.disabled=false;
  btn.textContent="Ingresar";

 }catch(e){

  console.error(e);

  error.textContent=
   "No se pudo conectar con el servidor.";

  btn.disabled=false;
  btn.textContent="Ingresar";
 }

}


/* =========================
   INICIO AUTOMÁTICO
========================= */

async function iniciar(){

 const {
  data:{session}
 }=await sb.auth.getSession();

 if(!session){

  document.getElementById("loginBox")
   .classList.remove("hidden");

  document.getElementById("app")
   .classList.add("hidden");

  return;
 }

 if(!session.user ||
    session.user.id!==ADMIN_ID){

  await sb.auth.signOut();
  return;
 }

 await mostrarAplicacion();

}


/* =========================
   MOSTRAR APP
========================= */

async function mostrarAplicacion(){

 document.getElementById("loginBox")
  .classList.add("hidden");

 document.getElementById("app")
  .classList.remove("hidden");

 await loadOrders();

 if(refreshTimer)
  clearInterval(refreshTimer);

 refreshTimer=
  setInterval(loadOrders,15000);

 revisarNotificaciones();

}


/* =========================
   PEDIDOS
========================= */

async function loadOrders(){

 try{

  const {
   data:orders,
   error
  }=await sb
   .from("pedidos")
   .select("*")
   .order("created_at",{ascending:false});

  if(error){

   document.getElementById("orders").innerHTML=
    "<div class='card'>No se pudieron cargar los pedidos.</div>";

   console.error(error);
   return;
  }

  const priority={
   "pendiente":0,
   "aceptado":1,
   "en camino":2,
   "entregado":3,
   "cancelado":4
  };

  orders.sort(function(a,b){

   const pa=priority[a.estado] ?? 99;
   const pb=priority[b.estado] ?? 99;

   if(pa!==pb)
    return pa-pb;

   return new Date(b.created_at)-
          new Date(a.created_at);

  });

  const container=
   document.getElementById("orders");

  container.innerHTML="";

  if(orders.length===0){

   container.innerHTML=
    "<div class='card'><h3>No hay pedidos.</h3></div>";

   return;
  }

  orders.forEach(function(order){

   const card=
    document.createElement("div");

   card.className=
    "card "+
    (order.estado==="pendiente"?"new":"");

   const newLabel=
    order.estado==="pendiente"
    ?"<div><b>🆕 NUEVO PEDIDO</b></div>"
    :"";

   const urgentLabel=
    order.urgente
    ?"<span class='urgent'>🚨 URGENTE</span>"
    :"";

   card.innerHTML=`

${newLabel}

<h2>
${safe(order.cliente)}
${urgentLabel}
</h2>

<div>📞 <b>${safe(order.telefono)}</b></div>

<div>📍 ${safe(order.direccion)}</div>

<div>💰 <b>$${safe(order.precio_total)}</b></div>

${order.observaciones
 ?`<div>📝 ${safe(order.observaciones)}</div>`
 :""
}

<select onchange="changeStatus(${order.id},this.value)">

<option value="pendiente"
${order.estado==="pendiente"?"selected":""}>
Pendiente
</option>

<option value="aceptado"
${order.estado==="aceptado"?"selected":""}>
Aceptado
</option>

<option value="en camino"
${order.estado==="en camino"?"selected":""}>
En camino
</option>

<option value="entregado"
${order.estado==="entregado"?"selected":""}>
Entregado
</option>

<option value="cancelado"
${order.estado==="cancelado"?"selected":""}>
Cancelado
</option>

</select>

<button class="blue"
onclick="openMaps(${order.latitud},${order.longitud})">
📍 Abrir Google Maps
</button>

<button
onclick="callCustomer('${safeAttr(order.telefono)}')">
📞 Llamar al cliente
</button>

<button class="red"
onclick="deleteOrder(${order.id})">
🗑️ Eliminar pedido
</button>

<div id="map-${order.id}"
style="height:220px;margin-top:10px;border-radius:12px">
</div>

`;

   container.appendChild(card);

   if(order.latitud && order.longitud){

    const map=L.map(
     "map-"+order.id
    ).setView(
     [order.latitud,order.longitud],
     15
    );

    L.tileLayer(
     "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
     {
      maxZoom:19,
      attribution:"© OpenStreetMap"
     }
    ).addTo(map);

    L.marker([
     order.latitud,
     order.longitud
    ]).addTo(map);

   }

  });

 }catch(e){

  console.log(e);

 }

}


/* =========================
   CAMBIAR ESTADO
========================= */

async function changeStatus(id,status){

 const {error}=
  await sb
   .from("pedidos")
   .update({estado:status})
   .eq("id",id);

 if(error){

  alert("No se pudo cambiar el estado.");
  return;
 }

 await loadOrders();

}


/* =========================
   ELIMINAR
========================= */

async function deleteOrder(id){

 if(!confirm(
  "¿Seguro que querés eliminar este pedido?"
 )) return;

 const {error}=
  await sb
   .from("pedidos")
   .delete()
   .eq("id",id);

 if(error){

  alert("No se pudo eliminar el pedido.");
  return;
 }

 await loadOrders();

}


/* =========================
   GOOGLE MAPS
========================= */

function openMaps(lat,lng){

 if(!lat || !lng){

  alert("Este pedido no tiene ubicación.");
  return;
 }

 window.open(
  "https://www.google.com/maps/dir/?api=1&destination="+
  lat+","+lng,
  "_blank"
 );

}


/* =========================
   LLAMAR
========================= */

function callCustomer(phone){

 window.location.href="tel:"+phone;

}


/* =========================
   CERRAR SESIÓN
========================= */

async function logout(){

 if(refreshTimer)
  clearInterval(refreshTimer);

 await sb.auth.signOut();

 location.reload();

}


/* =========================
   NOTIFICACIONES
========================= */

function revisarNotificaciones(){

 const btn=
  document.getElementById("notificationBtn");

 const status=
  document.getElementById("notificationStatus");

 if(!("Notification" in window)){

  btn.disabled=true;

  status.textContent=
   "Este navegador no permite notificaciones.";

  return;
 }

 if(Notification.permission==="granted"){

  btn.textContent=
   "🔔 Notificaciones activadas";

  status.textContent=
   "Podés recibir avisos de nuevos pedidos.";

 }

}


/* =========================
   ACTIVAR NOTIFICACIONES
========================= */

async function activarNotificaciones(){

 const btn=
  document.getElementById("notificationBtn");

 const status=
  document.getElementById("notificationStatus");

 try{

  if(!("Notification" in window)){

   throw new Error(
    "Este navegador no permite notificaciones."
   );

  }

  const permission=
   await Notification.requestPermission();

  if(permission!=="granted"){

   throw new Error(
    "Las notificaciones fueron bloqueadas."
   );

  }

  const registration=
   await navigator.serviceWorker.ready;

  const {
   data:{session}
  }=await sb.auth.getSession();

  if(!session){

   throw new Error(
    "La sesión no está disponible."
   );

  }

  const response=
   await fetch(
    FUNCTION_URL,
    {
     method:"GET",
     headers:{
      "apikey":SUPABASE_KEY,
      "Authorization":
       "Bearer "+session.access_token
     }
    }
   );

  if(!response.ok){

   throw new Error(
    "No se pudo obtener la configuración de notificaciones."
   );

  }

  const config=
   await response.json();

  if(!config.vapidPublicKey){

   throw new Error(
    "No se recibió la clave pública VAPID."
   );

  }

  const subscription=
   await registration.pushManager.subscribe({

    userVisibleOnly:true,

    applicationServerKey:
     urlBase64ToUint8Array(
      config.vapidPublicKey
     )

   });

  const json=
   subscription.toJSON();

  if(!json.keys){

   throw new Error(
    "El navegador no devolvió las claves de la suscripción."
   );

  }

  const {error}=
   await sb
    .from("push_subscriptions")
    .upsert(
     {
      user_id:session.user.id,
      endpoint:json.endpoint,
      p256dh:json.keys.p256dh,
      auth:json.keys.auth
     },
     {
      onConflict:"endpoint"
     }
    );

  if(error)
   throw error;

  btn.textContent=
   "🔔 Notificaciones activadas";

  status.textContent=
   "✅ Este teléfono recibirá avisos de nuevos pedidos.";

  status.className=
   "small success";

 }catch(e){

  console.error(e);

  status.textContent=
   "❌ "+e.message;

  status.className=
   "small warning";

 }

}


/* =========================
   VAPID
========================= */

function urlBase64ToUint8Array(base64String){

 const padding=
  "=".repeat(
   (4-base64String.length%4)%4
  );

 const base64=
  (base64String+padding)
   .replace(/-/g,"+")
   .replace(/_/g,"/");

 const rawData=
  window.atob(base64);

 return Uint8Array.from(
  [...rawData].map(
   char=>char.charCodeAt(0)
  )
 );

}


/* =========================
   SEGURIDAD
========================= */

function safe(value){

 return String(value ?? "")
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}

function safeAttr(value){

 return String(value ?? "")
  .replace(/'/g,"");

}


/* =========================
   BOTONES
========================= */

document.getElementById("loginBtn")
 .onclick=login;

document.getElementById("logoutBtn")
 .onclick=logout;

document.getElementById("notificationBtn")
 .onclick=activarNotificaciones;


/* =========================
   SERVICE WORKER
========================= */

if("serviceWorker" in navigator){

 navigator.serviceWorker.register(
  "./sw.js?v=5"
 ).catch(function(error){

  console.log(
   "Error Service Worker:",
   error
  );

 });

}


/* =========================
   ARRANCAR
========================= */

iniciar();

</script>

</body>
</html>
